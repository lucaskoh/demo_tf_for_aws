# EC2 image templates, maintained by the platform team.
#
# An instance in values.yaml must name one of these under "template:". A template says
# which image to start from and what to run at boot, so users cannot choose an
# arbitrary AMI or script.
#
# Adding a template: add an entry here and the user data file next to this file.
# The file is a templatefile() template and gets these variables from layers/compute:
#   http_port   port the web server listens on
#   paths       list of URL paths (without slashes) the page is served under
#   page_html   the page, as a single line
#
# Fields: ami_name_pattern (required), user_data_file (required), ami_owners (default
# [amazon]), root_volume_size (default 8), root_volume_type (default gp3).

nginx-demo:
  description: Amazon Linux 2023 with Nginx serving the demo page
  ami_name_pattern: al2023-ami-2023.*-x86_64
  ami_owners: [amazon]
  user_data_file: nginx-demo.sh.tftpl
  root_volume_size: 8
  root_volume_type: gp3
