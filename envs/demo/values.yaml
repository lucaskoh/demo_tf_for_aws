# yaml-language-server: $schema=../../schemas/values.schema.json
# Environment values shared by all layers (network, compute, workloads, edge).
# Each layer reads this file with yamldecode(file(...)), see values.tf in the layer.
#
# Not here (they come from GitHub variables / terraform.tfvars, see README):
#   eks_admin_principal_arns, ci_plan_role_arn, ci_apply_role_arn,
#   domain_name, record_name.
#
# The layers use a partial S3 backend: scripts/tf.sh reads common.state_bucket and common.region
# from this file and passes them to `terraform init`. Write both as "key: value" on one line
# directly under `common:` (make validate-values checks that).

common:
  # Short name prefix for resources (lowercase letters, digits, hyphens; max 20 characters)
  name: demo
  region: ap-northeast-1
  # S3 bucket holding the Terraform state of all layers (state_bucket_name output of bootstrap)
  state_bucket: lucaskoh-tfstate-demo-22f4d2
  # Applied to every resource through default_tags; each layer adds a "Layer" tag
  tags:
    Project: aws-multi-vpc-terraform
    Environment: demo
    ManagedBy: terraform
  # Port of the NLB and ALB listeners, and of Nginx on the EC2 backend
  http_port: 80

network:
  # VPC CIDRs must not overlap (subnets are derived from them: /16 -> /24)
  vpc_a_cidr: 10.0.0.0/16 # NLB, ALB, EKS
  vpc_b_cidr: 10.1.0.0/16 # EC2

compute:
  ec2_instance_type: t3.micro
  eks:
    # Several instance types improve Spot availability
    instance_types: [t3.small, t3a.small]
    capacity_type: SPOT # SPOT or ON_DEMAND
    desired_size: 1
    min_size: 1
    max_size: 2
    # Who may reach the public Kubernetes API endpoint (optional, default ["0.0.0.0/0"]). Every request still
    # needs an IAM identity with an EKS access entry. The workloads layer talks to the API from the CI runner:
    # a narrower list also locks out the GitHub-hosted runners (use a self-hosted runner in an allowed range).
    #   public_access_cidrs: ["203.0.113.10/32"]
  # EKS Kubernetes version, e.g. "1.33" (quote it). null = the EKS default for new clusters.
  kubernetes_version: null

# What runs, and how traffic reaches it. Names are lowercase letters, digits and hyphens.

# Deployments on the EKS cluster. Only the ones that a backend routes to get a NodePort
# and security group rules; the others are reachable inside the cluster only.
workloads:
  web:
    # Optional. Without "image" the built-in Nginx demo page is served at the routed path(s).
    #   image: nginx:1.27-alpine
    #   container_port: 80             # the demo page needs 80
    #   replicas: 1
    #   health_check_path: /           # readiness probe
    #   node_port: 30080               # derived from the name when not set (30000-32767)
    #   page_title / page_heading      # texts of the demo page

# Nginx instances in VPC-B, reached over the VPC peering.
instances:
  legacy:
    template: nginx-demo # required: an image template from templates/ec2/templates.yaml
    # Optional:
    #   instance_type: t3.micro        # default: compute.ec2_instance_type
    #   private_ip: 10.1.1.100         # derived from the name when not set
    #   page_title / page_heading

# Routes on the ALB: a path that leads to one workload or one instance.
# "<common.name>-<backend name>-tg" must fit in 32 characters.
backends:
  eks-page:
    path: html1 # served at /html1 (one URL segment; the app must serve under this prefix)
    workload: web
    # Optional:
    #   health_check_path: /html1/index.html   # ALB health check (default: demo page, or / for a custom image)
    #   priority: 10                           # derived from the name when not set
  ec2-page:
    path: html2
    instance: legacy
