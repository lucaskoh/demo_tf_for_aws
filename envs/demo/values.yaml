# Environment values shared by all layers (network, compute, workloads, edge).
# Each layer reads this file with yamldecode(file(...)), see values.tf in the layer.
#
# Not here (they come from GitHub variables / terraform.tfvars, see README):
#   eks_admin_principal_arns, ci_plan_role_arn, ci_apply_role_arn,
#   domain_name, record_name.
#
# backend.tf cannot read this file (backend blocks cannot use variables), so the
# state bucket and region are also hard-coded there. Keep them in sync.

common:
  # Short name prefix for resources (lowercase letters, digits, hyphens; max 20 characters)
  name: demo
  region: ap-northeast-1
  # S3 bucket holding the Terraform state of all layers (state_bucket_name output of bootstrap)
  state_bucket: lucaskoh-tfstate-demo-22f4d2
  # Applied to every resource through default_tags; each layer adds a "Layer" tag
  tags:
    Project: aws-multi-vpc-terraform
    Environment: demo
    ManagedBy: terraform

network:
  # VPC CIDRs must not overlap (subnets are derived from them: /16 -> /24)
  vpc_a_cidr: 10.0.0.0/16 # NLB, ALB, EKS
  vpc_b_cidr: 10.1.0.0/16 # EC2
  # Kubernetes NodePort between the ALB and the EKS nodes (30000-32767)
  node_port: 30080

compute:
  # Fixed private IP of the EC2 instance. null = the .100 address of the VPC-B subnet.
  ec2_private_ip: null
  # EKS Kubernetes version, e.g. "1.33" (quote it). null = the EKS default for new clusters.
  kubernetes_version: null
