name: Terraform Plan

on:
  pull_request:
    # No paths filter on purpose: validate and plan are required checks of the main branch,
    # and a required check that never runs (for example on a README-only change) would block
    # the merge forever.
    branches: [main]

permissions:
  contents: read
  id-token: write       # OIDC login to AWS
  pull-requests: write  # post the plan as a PR comment

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # Referencing the secret makes the runner mask the account ID everywhere in the logs
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_record_name: ${{ vars.RECORD_NAME || 'demo' }}
  TF_VAR_ci_plan_role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
  TF_VAR_ci_apply_role_arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
  # JSON list, e.g. ["arn:aws:iam::<account>:user/<name>"]; must be identical in plan, apply and destroy
  TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      # Python for the values.yaml schema checks; a virtualenv because the system Python
      # of the runner does not allow installing packages into it.
      - name: install the schema validator
        run: |
          python3 -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet -r scripts/requirements.txt

      - name: schema tests
        run: make test-schemas PYTHON=/tmp/schema-venv/bin/python

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # Checks values.yaml and the EC2 templates against their schema first (errors show as
      # annotations on the pull request), then validates every layer without a backend
      - name: values.yaml schema and terraform validate (all layers, no backend)
        run: make validate PYTHON=/tmp/schema-venv/bin/python

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          # The demo intentionally uses public subnets and a public S3 bucket, so findings only warn (soft_fail) and do not block merge
          soft_fail: true
          # Without a token the action calls the GitHub API anonymously and is often rate-limited
          github_token: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: plan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Plans network, compute, workloads and edge in order, for every
      # environment under envs/. A layer whose upstream layers are not deployed
      # yet is skipped, not failed.
      - name: terraform plan (all environments, all layers)
        id: plan
        continue-on-error: true
        run: |
          failed=0
          for dir in envs/*/; do
            bash .github/scripts/plan-layers.sh "$(basename "$dir")" || failed=1
          done
          exit "$failed"

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const root = 'plan-output';
            const icons = { success: '✅', skipped: '⏭️', failed: '❌' };
            const maxPerLayer = 14000;

            // plan-output/<environment>/summary.tsv and <layer>.txt
            const envs = fs.existsSync(root) ? fs.readdirSync(root).sort() : [];
            const summaryLines = [];
            const sections = [];

            for (const env of envs) {
              const dir = `${root}/${env}`;
              const summaryFile = `${dir}/summary.tsv`;
              const rows = fs.existsSync(summaryFile)
                ? fs.readFileSync(summaryFile, 'utf8').trim().split('\n').filter(Boolean).map(l => l.split('\t'))
                : [];

              summaryLines.push(`**${env}**: ` + (rows.map(([layer, status]) => `${icons[status] || '?'} \`${layer}\` ${status}`).join(' · ') || '(no plan output)'));

              for (const [layer, status] of rows) {
                const file = `${dir}/${layer}.txt`;
                let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(no output)';
                // Comments are not masked by the runner, so hide the account ID here
                const accountId = process.env.AWS_ACCOUNT_ID;
                if (accountId) text = text.split(accountId).join('************');
                if (text.length > maxPerLayer) {
                  text = text.slice(0, maxPerLayer) + '\n\n... (truncated, see workflow logs)';
                }
                sections.push([
                  `<details><summary>${icons[status] || '?'} <b>${env} / ${layer}</b>: ${status}</summary>`,
                  '',
                  '```terraform',
                  text,
                  '```',
                  '',
                  '</details>',
                ].join('\n'));
              }
            }

            const ok = process.env.PLAN_OUTCOME === 'success';
            const body = [
              marker,
              `### Terraform Plan: ${ok ? '✅ success' : '❌ failed'}`,
              '',
              summaryLines.join('\n\n') || '(no plan output)',
              '',
              '_Layers whose upstream layers are not deployed yet are skipped; they cannot be planned until the upstream layers are applied._',
              '',
              ...sections,
              '',
              `_Commit: ${context.sha.slice(0, 7)}_`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
