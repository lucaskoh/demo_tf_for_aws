name: Terraform Apply

# Manual trigger: Actions → Terraform Apply → Run workflow (merging does not deploy)
on:
  workflow_dispatch:
    inputs:
      env_name:
        description: "Environment to apply (a folder under envs/)"
        required: true
        default: demo
        type: string

permissions:
  contents: read
  id-token: write

# Only one apply at a time, and never cancel midway, to avoid a stale state lock
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # Referencing the secret makes the runner mask the account ID everywhere in the logs
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_record_name: ${{ vars.RECORD_NAME || 'demo' }}
  TF_VAR_ci_plan_role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
  TF_VAR_ci_apply_role_arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
  # JSON list, e.g. ["arn:aws:iam::<account>:user/<name>"]; must be identical in plan, apply and destroy
  TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  apply:
    name: apply
    # Can only run from the main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Bound to an environment: Required reviewers in GitHub give a manual approval before apply,
    # and the AWS apply role only trusts OIDC tokens from this environment.
    # All layers run as steps of this one job so the whole apply needs a single approval.
    environment: production
    env:
      # Passed through the environment, not interpolated into the scripts
      ENV_NAME: ${{ inputs.env_name }}
    steps:
      # The whole history: an environment can pin a platform version, which is a git tag (scripts/prepare-platform.sh)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Order matters: each layer reads the state of the layers before it.
      # workloads and edge only depend on network and compute.

      - name: apply network
        run: bash .github/scripts/apply-layer.sh "$ENV_NAME" network

      - name: apply compute
        run: bash .github/scripts/apply-layer.sh "$ENV_NAME" compute

      - name: apply workloads
        run: bash .github/scripts/apply-layer.sh "$ENV_NAME" workloads

      - name: apply edge
        run: bash .github/scripts/apply-layer.sh "$ENV_NAME" edge

      - name: Show outputs
        run: scripts/tf.sh "$ENV_NAME" edge output
