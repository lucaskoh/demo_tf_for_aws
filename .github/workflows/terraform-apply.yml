name: Terraform Apply

# Manual trigger: Actions → Terraform Apply → Run workflow (merging does not deploy)
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Only one apply at a time, and never cancel midway, to avoid a stale state lock
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_record_name: ${{ vars.RECORD_NAME || 'demo' }}
  TF_VAR_ci_plan_role_arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
  TF_VAR_ci_apply_role_arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
  # JSON list, e.g. ["arn:aws:iam::<account>:user/<name>"]; must be identical in plan, apply and destroy
  TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  apply:
    name: apply
    # Can only run from the main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Bound to an environment: Required reviewers in GitHub give a manual approval before apply,
    # and the AWS apply role only trusts OIDC tokens from this environment.
    # All layers run as steps of this one job so the whole apply needs a single approval.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Order matters: each layer reads the state of the layers before it.
      # workloads and edge only depend on network and compute.

      - name: apply network
        working-directory: envs/demo/network
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false -out=tfplan
          terraform apply -no-color -input=false tfplan

      - name: apply compute
        working-directory: envs/demo/compute
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false -out=tfplan
          terraform apply -no-color -input=false tfplan

      - name: apply workloads
        working-directory: envs/demo/workloads
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false -out=tfplan
          terraform apply -no-color -input=false tfplan

      - name: apply edge
        working-directory: envs/demo/edge
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false -out=tfplan
          terraform apply -no-color -input=false tfplan

      - name: Show outputs
        working-directory: envs/demo/edge
        run: terraform output
