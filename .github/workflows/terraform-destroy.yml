name: Terraform Destroy

# Manual trigger: Actions → Terraform Destroy → Run workflow → type "destroy"
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down the environment'
        required: true
        type: string
      env_name:
        description: "Environment to destroy (a folder under envs/)"
        required: true
        default: demo
        type: string

permissions:
  contents: read
  id-token: write

# Shares a group with apply so apply and destroy never run at the same time
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # Referencing the secret makes the runner mask the account ID everywhere in the logs
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_record_name: ${{ vars.RECORD_NAME || 'demo' }}
  TF_VAR_ci_plan_role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
  TF_VAR_ci_apply_role_arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
  # JSON list, e.g. ["arn:aws:iam::<account>:user/<name>"]; must be identical in plan, apply and destroy
  TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}

jobs:
  destroy:
    name: destroy
    # Requires typing "destroy" and can only run from the main branch
    if: ${{ inputs.confirm == 'destroy' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Same environment as apply: Required reviewers can add a second approval.
    # All layers run as steps of this one job so the whole destroy needs a single approval.
    environment: production
    env:
      # Passed through the environment, not interpolated into the scripts
      ENV_NAME: ${{ inputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Reverse of the apply order. workloads must go before compute: the
      # kubernetes provider needs the cluster to still exist.
      # Each layer is retried a few times: some deletions fail once because AWS
      # finishes an earlier deletion asynchronously (see destroy-layer.sh).
      # A destroy plan still reads the remote state of the layers it depends on,
      # which is why network and compute are destroyed last.

      - name: destroy edge
        run: bash .github/scripts/destroy-layer.sh "$ENV_NAME" edge

      - name: destroy workloads
        run: bash .github/scripts/destroy-layer.sh "$ENV_NAME" workloads

      - name: destroy compute
        run: bash .github/scripts/destroy-layer.sh "$ENV_NAME" compute

      - name: destroy network
        run: bash .github/scripts/destroy-layer.sh "$ENV_NAME" network
