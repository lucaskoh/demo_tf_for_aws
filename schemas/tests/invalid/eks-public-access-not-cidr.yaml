# expect: must be a CIDR block
common:
  name: demo
  region: ap-northeast-1
  state_bucket: example-tfstate-bucket
  tags:
    Project: demo
    Environment: demo
  http_port: 80
network:
  vpc_a_cidr: 10.0.0.0/16
  vpc_b_cidr: 10.1.0.0/16
compute:
  ec2_instance_type: t3.micro
  eks:
    instance_types: [t3.small, t3a.small]
    capacity_type: SPOT
    desired_size: 1
    min_size: 1
    max_size: 2
    public_access_cidrs: [0.0.0.0]
  kubernetes_version: null
workloads:
  web:
    replicas: 2
instances:
  legacy:
    template: nginx-demo
backends:
  home:
    path: home
    workload: web
  legacy:
    path: legacy
    instance: legacy
